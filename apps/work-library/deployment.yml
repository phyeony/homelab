apiVersion: apps/v1
kind: Deployment
metadata:
  name: work-library
spec:
  replicas: 1 # SQLite: a single writer
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: work-library
  template:
    metadata:
      labels:
        app: work-library
    spec:
      securityContext:
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: work-library
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: work-library
            - secretRef:
                name: work-library
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: work-library-data
