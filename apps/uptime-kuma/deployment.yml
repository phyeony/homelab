apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  # SQLite on an RWO volume, and Kuma can't run as multiple instances (each would run every check
  # and send every alert). Recreate stops the old pod before starting the new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # Prefer the worker so Kuma survives (and can alert on) a failure of main, which runs the
      # control plane, Traefik and cloudflared. Soft, so it falls back to main if the worker is down.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [worker-liva]
      containers:
        - name: app
          image: uptime-kuma
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30 # first start runs DB migrations
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        # Syncs the JSON files in monitors/ into Uptime Kuma through its API.
        - name: autokuma
          image: autokuma
          env:
            # No credentials: Kuma's own auth is disabled in its settings (Settings → Security),
            # and Cloudflare Access guards the tunnel hostname instead.
            - name: AUTOKUMA__KUMA__URL
              value: http://localhost:3001
            - name: AUTOKUMA__STATIC_MONITORS
              value: /monitors
            # ConfigMap volumes expose each key as a symlink; AutoKuma skips symlinks by default.
            - name: AUTOKUMA__FILES__FOLLOW_SYMLINKS
              value: "true"
            - name: AUTOKUMA__DATA_PATH
              value: /data
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            # The ConfigMap takes about a minute to reach the mounted files anyway.
            - name: AUTOKUMA__SYNC_INTERVAL
              value: "60"
            # A file that fails to parse looks deleted; keep its monitor (and history) instead.
            - name: AUTOKUMA__ON_DELETE
              value: keep
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: autokuma # its ID map lives next to kuma.db; without it, restarts duplicate monitors
            - name: monitors
              mountPath: /monitors
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
        - name: monitors
          configMap:
            name: autokuma-monitors
