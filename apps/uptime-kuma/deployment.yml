apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  # SQLite on an RWO volume, and Kuma can't run as multiple instances (each would run every check
  # and send every alert). Recreate stops the old pod before starting the new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # Prefer the worker so Kuma survives (and can alert on) a failure of main, which runs the
      # control plane, Traefik and cloudflared. Soft, so it falls back to main if the worker is down.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [worker-liva]
      containers:
        - name: app
          image: uptime-kuma
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30 # first start runs DB migrations
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-data
